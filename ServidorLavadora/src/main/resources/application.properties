# Nombre de la aplicacion
spring.application.name=ServidorLavadora
# Puerto donde escucha el servidor (el cliente usa este mismo puerto)
server.port=8081
# GraphiQL: pagina para probar el servicio en http://localhost:8081/graphiql
spring.graphql.graphiql.enabled=true
# Ruta del servicio GraphQL: http://localhost:8081/graphql
spring.graphql.path=/graphql
# Permite que cualquier cliente (otro computador o lenguaje) llame al servidor
spring.graphql.cors.allowed-origins=*
spring.graphql.cors.allowed-methods=GET,POST,OPTIONS

# Nombre de la aplicacion
spring.application.name=ServidorLavadora

# Puerto donde escucha el servidor (los dos clientes usan este mismo puerto)
server.port=8081

# GraphiQL: pagina para probar el servicio en http://localhost:8081/graphiql
spring.graphql.graphiql.enabled=true

# Ruta del servicio GraphQL: http://localhost:8081/graphql
spring.graphql.path=/graphql

# CORS: permite que los clientes (el de escritorio y el de navegador) llamen al
# servidor sin importar desde que direccion se abran. Un cliente web abierto
# como archivo local o servido en otro puerto tambien puede consultar.
spring.graphql.cors.allowed-origins=*
spring.graphql.cors.allowed-methods=GET,POST,OPTIONS
spring.graphql.cors.allowed-headers=*

# MongoDB: la base de datos principal es no relacional y usa ObjectId de MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/voltia
spring.data.mongodb.database=voltia
spring.data.mongodb.auto-index-creation=true

# MongoDB es el almacen predeterminado. Si no está disponible, el servidor falla
# al iniciar para evitar guardar datos en memoria sin que el usuario lo advierta.
voltia.almacen=mongo
